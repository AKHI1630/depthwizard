<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DepthWizard — 3D Flythrough</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a12; color: #e0e0e0; font-family: Arial, sans-serif; overflow: hidden; }
  #canvas-container { width: 100vw; height: 100vh; }
  #ui {
    position: fixed; top: 16px; left: 16px; z-index: 10;
    background: rgba(10,10,20,0.82); border: 1px solid #333;
    border-radius: 8px; padding: 14px 18px; min-width: 220px;
    backdrop-filter: blur(6px);
  }
  #ui h1 { font-size: 15px; font-weight: bold; color: #7ec8e3; margin-bottom: 12px; letter-spacing: 0.05em; }
  label { display: block; font-size: 12px; color: #aaa; margin-bottom: 3px; }
  input[type=range] { width: 100%; accent-color: #7ec8e3; }
  #ve-value { font-size: 12px; color: #7ec8e3; float: right; }
  .row { margin-bottom: 12px; }
  #file-btn {
    display: inline-block; cursor: pointer; background: #1e3a5f;
    border: 1px solid #7ec8e3; border-radius: 5px; padding: 6px 12px;
    font-size: 12px; color: #7ec8e3; width: 100%; text-align: center;
    transition: background 0.2s;
  }
  #file-btn:hover { background: #2a5080; }
  #file-input { display: none; }
  #status { font-size: 11px; color: #888; margin-top: 8px; min-height: 16px; }
</style>
</head>
<body>
<div id="canvas-container"></div>
<div id="ui">
  <h1>DepthWizard</h1>
  <div class="row">
    <label>Vertical Exaggeration <span id="ve-value">2.0×</span></label>
    <input type="range" id="ve-slider" min="0.1" max="10" step="0.1" value="2.0">
  </div>
  <div class="row">
    <label>Estimator</label>
    <select id="estimator-select" style="width:100%;background:#1a1a2e;color:#e0e0e0;border:1px solid #444;border-radius:4px;padding:4px 6px;font-size:12px;">
      <option value="depth" selected>Depth-Anything-V2-Small</option>
      <option value="synthetic">Synthetic (debug)</option>
    </select>
  </div>
  <div class="row">
    <label for="file-btn">Upload Image</label>
    <div id="file-btn" onclick="document.getElementById('file-input').click()">Choose file…</div>
    <input type="file" id="file-input" accept="image/*">
  </div>
  <div id="warning" style="display:none;font-size:11px;color:#f4a261;margin-top:6px;"></div>
  <div id="status">Ready — orbit: left drag · zoom: scroll · pan: right drag</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ─── Renderer ───────────────────────────────────────────────────────────────
const container = document.getElementById('canvas-container');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
container.appendChild(renderer.domElement);

// Float textures are not universally supported (WebGL 1 / mobile).
// We use RGBA UnsignedByte with RG-packed 16-bit heights instead.
console.log('[DepthWizard] Using RG-packed RGBA Uint8 heightmap — no float texture dependency.');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a12);
scene.fog = new THREE.Fog(0x0a0a12, 800, 2000);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 5000);
camera.position.set(0, 400, 700);
camera.lookAt(0, 0, 0);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

// ─── Shaders ────────────────────────────────────────────────────────────────
// Heights are RG-packed 16-bit in an RGBA Uint8 texture.
// Pack (JS): val = round(norm * 65535); R = val >> 8; G = val & 0xFF
// Unpack (GLSL): h = (texel.r*255.0*256.0 + texel.g*255.0) / 65535.0
// NearestFilter is mandatory — bilinear filtering blends R and G bytes,
// corrupting the unpacked value at edges.
const vertexShader = `
  uniform sampler2D uHeightMap;
  uniform float uExaggeration;
  uniform float uMinHeight;
  uniform float uMaxHeight;
  uniform float uTexelSize;   // 1.0 / max(width, height)

  varying float vNormHeight;  // [0,1] for colour ramp
  varying float vDiffuse;     // Lambertian term

  // Unpack 16-bit height from RG channels of a Uint8 RGBA texture.
  // WebGL normalises Uint8 channels to [0,1], so byte = channel * 255.
  float unpackHeight(vec2 uv) {
    vec4 t = texture2D(uHeightMap, uv);
    return (t.r * 255.0 * 256.0 + t.g * 255.0) / 65535.0;
  }

  void main() {
    vec2 uv = uv;
    float h = unpackHeight(uv);

    // Central-difference normals — four neighbours at texel-step distance.
    // Scale differences by the same factor as displacement so normals
    // track the exaggerated surface, not the flat normalised one.
    float eps = uTexelSize;
    float hL = unpackHeight(uv + vec2(-eps,  0.0));
    float hR = unpackHeight(uv + vec2( eps,  0.0));
    float hD = unpackHeight(uv + vec2( 0.0, -eps));
    float hU = unpackHeight(uv + vec2( 0.0,  eps));

    float range = uMaxHeight - uMinHeight;
    float scale = range * uExaggeration;
    vec3 normal = normalize(vec3((hL - hR) * scale, 2.0, (hD - hU) * scale));

    // sunDir inside main() — GLSL ES forbids function calls in global initialisers
    vec3 sunDir = normalize(vec3(0.6, 1.0, 0.5));
    vDiffuse = max(dot(normal, sunDir), 0.0);

    vNormHeight = h;  // [0,1]

    float worldH = h * scale;
    vec3 displaced = position + vec3(0.0, worldH, 0.0);
    gl_Position = projectionMatrix * modelViewMatrix * vec4(displaced, 1.0);
  }
`;

const fragmentShader = `
  varying float vNormHeight;
  varying float vDiffuse;

  // Step 4: debug height ramp — dark blue (low) → bright white (high)
  vec3 heightRamp(float t) {
    vec3 deep  = vec3(0.05, 0.12, 0.35);
    vec3 low   = vec3(0.13, 0.43, 0.18);
    vec3 mid   = vec3(0.62, 0.52, 0.30);
    vec3 high  = vec3(0.95, 0.95, 0.95);
    if (t < 0.33) return mix(deep, low,  t / 0.33);
    if (t < 0.66) return mix(low,  mid, (t - 0.33) / 0.33);
    return           mix(mid,  high, (t - 0.66) / 0.34);
  }

  void main() {
    vec3 baseCol = heightRamp(vNormHeight);
    // Ambient 0.35 + diffuse 0.65 — no scene lights needed
    float shade = 0.35 + 0.65 * vDiffuse;
    gl_FragColor = vec4(baseCol * shade, 1.0);
  }
`;

// ─── Terrain mesh ───────────────────────────────────────────────────────────
const GRID = 512;
const PLANE_SIZE = 900;

// Placeholder: 2×2 RGBA Uint8 texture (all zeros = height 0)
const placeholderData = new Uint8Array(2 * 2 * 4);
const heightTexture = new THREE.DataTexture(
  placeholderData, 2, 2,
  THREE.RGBAFormat, THREE.UnsignedByteType
);
heightTexture.minFilter = THREE.NearestFilter;
heightTexture.magFilter = THREE.NearestFilter;
heightTexture.needsUpdate = true;

const uniforms = {
  uHeightMap:    { value: heightTexture },
  uExaggeration: { value: 2.0 },
  uMinHeight:    { value: 0.0 },
  uMaxHeight:    { value: 1.0 },
  uTexelSize:    { value: 0.5 },
};

const geometry = new THREE.PlaneGeometry(PLANE_SIZE, PLANE_SIZE, GRID, GRID);
geometry.rotateX(-Math.PI / 2);

const material = new THREE.ShaderMaterial({
  vertexShader, fragmentShader, uniforms,
  side: THREE.DoubleSide,
});

const mesh = new THREE.Mesh(geometry, material);
scene.add(mesh);

const grid = new THREE.GridHelper(PLANE_SIZE, 20, 0x223344, 0x223344);
grid.position.y = -0.5;
scene.add(grid);

// ─── Vertical exaggeration ──────────────────────────────────────────────────
const veSlider = document.getElementById('ve-slider');
const veValue  = document.getElementById('ve-value');
veSlider.addEventListener('input', () => {
  const v = parseFloat(veSlider.value);
  uniforms.uExaggeration.value = v;
  veValue.textContent = v.toFixed(1) + '×';
});

// ─── Upload + parse ─────────────────────────────────────────────────────────
document.getElementById('file-input').addEventListener('change', async () => {
  const file = document.getElementById('file-input').files[0];
  if (!file) return;
  const status = document.getElementById('status');
  status.textContent = 'Uploading…';

  const estimator = document.getElementById('estimator-select').value;
  const formData = new FormData();
  formData.append('file', file);

  try {
    const resp = await fetch(`/upload?estimator=${estimator}`, { method: 'POST', body: formData });
    if (!resp.ok) { status.textContent = 'Server error: ' + resp.status; return; }

    const buf = await resp.arrayBuffer();
    const view = new DataView(buf);
    const metaLen = view.getUint32(0, true);  // 4-byte LE prefix

    // Decode metadata JSON
    const metaBytes = new Uint8Array(buf, 4, metaLen);
    const meta = JSON.parse(new TextDecoder().decode(metaBytes));
    const { width, height, min_height, max_height } = meta;

    // Copy raw bytes into an aligned buffer — offset (4+metaLen) may not be
    // 4-byte aligned, which would throw a RangeError on Float32Array construction.
    const rawByteOffset = 4 + metaLen;
    const rawByteLength = width * height * 4;
    const aligned = new ArrayBuffer(rawByteLength);
    new Uint8Array(aligned).set(new Uint8Array(buf, rawByteOffset, rawByteLength));
    const floatData = new Float32Array(aligned);

    // Diagnostic — runs unconditionally before any texture work.
    // If min===max here the bug is backend or parsing; otherwise it's downstream.
    let mn = Infinity, mx = -Infinity, sum = 0;
    for (let i = 0; i < floatData.length; i++) {
      const v = floatData[i];
      if (v < mn) mn = v;
      if (v > mx) mx = v;
      sum += v;
    }
    const mean = sum / floatData.length;
    console.log(`[DepthWizard] float32: length=${floatData.length}, min=${mn.toFixed(2)}, max=${mx.toFixed(2)}, mean=${mean.toFixed(2)}`);
    console.log(`[DepthWizard] metadata:`, meta);
    if (mn === mx) {
      console.warn('[DepthWizard] *** min===max — data is flat; bug is backend or parsing ***');
    } else {
      console.log('[DepthWizard] data has height variation — proceeding to pack texture');
    }

    // Surface backend fallback warning in UI
    const warningEl = document.getElementById('warning');
    if (meta.warning) {
      warningEl.textContent = '⚠ ' + meta.warning;
      warningEl.style.display = 'block';
      console.warn('[DepthWizard] backend warning:', meta.warning);
    } else {
      warningEl.style.display = 'none';
    }

    // Pack normalised height into RG channels of a Uint8 RGBA texture.
    // val ∈ [0, 65535]; R = high byte, G = low byte, B/A unused (0).
    // Round-trip: h = (R*256 + G) / 65535 ≈ h_norm to within 1/65535.
    const range = max_height - min_height || 1.0;
    const rgba = new Uint8Array(width * height * 4);
    for (let i = 0; i < width * height; i++) {
      const norm = (floatData[i] - min_height) / range;
      const val  = Math.round(Math.min(Math.max(norm, 0.0), 1.0) * 65535);
      rgba[i * 4 + 0] = (val >> 8) & 0xFF;   // R — high byte
      rgba[i * 4 + 1] =  val       & 0xFF;   // G — low byte
      rgba[i * 4 + 2] = 0;
      rgba[i * 4 + 3] = 255;
    }

    // Spot-check round-trip on one pixel (centre)
    const ci = Math.floor(height / 2) * width + Math.floor(width / 2);
    const ciR = rgba[ci * 4], ciG = rgba[ci * 4 + 1];
    const unpacked = (ciR * 256 + ciG) / 65535 * range + min_height;
    console.log(`[DepthWizard] round-trip check centre px: original=${floatData[ci].toFixed(2)}, repacked=${unpacked.toFixed(2)}`);

    const tex = new THREE.DataTexture(rgba, width, height, THREE.RGBAFormat, THREE.UnsignedByteType);
    tex.minFilter = THREE.NearestFilter;
    tex.magFilter = THREE.NearestFilter;
    tex.needsUpdate = true;

    uniforms.uHeightMap.value = tex;
    uniforms.uMinHeight.value = min_height;
    uniforms.uMaxHeight.value = max_height;
    uniforms.uTexelSize.value = 1.0 / Math.max(width, height);

    status.textContent = `Loaded ${width}×${height} · ${min_height.toFixed(1)}–${max_height.toFixed(1)} m`;

  } catch (e) {
    console.error('[DepthWizard] upload error:', e);
    document.getElementById('status').textContent = 'Error: ' + e.message;
  }
});

// ─── Resize / render loop ───────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

(function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
